<head>
    <style>
      .combo {
        padding: 10px;
        width: 200px;
      }
    </style>

    <title>Sign In Page</title>
  </head>
  <body
    style="background-image: url('https://cdn.glitch.com/d74445b9-7ab7-4721-b3b0-3d929d3008f3%2Fmaxresdefault.jpg?v=1629649399458'); background-size: cover;"
  >
    <h1 style="text-align:center;">Sign In</h1>
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size: 15px;">Email: </lable>
      <input
        style="border:1px solid rgb(41,40,40); width: 500px"
        ;
        placeholder="acbs@gmail.com"
      />
    </div>
    <br />
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size: 15px">Username: </lable>
      <input
        style="border:1px solid rgb(41,40,40); width: 500px"
        ;
        placeholder="students1234"
      />
    </div>
    <br />
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size:15px">Passwords: </lable>
      <input
        style="border: 1px solid rgb(41,40,40); width: 500px"
        ;
        placeholder="hsjdadfh"
      />
    </div>
    <br />
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size: 15px">Highschool: </lable>
      <input
        style="border: 1px solid rgb(41,40,40); width: 500px"
        ;
        placeholder="abchighschool"
      />
    </div>
    <br />
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size: 15px"> Experience: </lable>
      <select class="combo">
        <option value="select"> Select...</option>
        <option value="I have never use code before"
          >I have never use code before</option
        >
        <option value="I have tried code and a bit similar to some languages"
          >I have tried code and a bit similar to some languages</option
        >
        <option value="I am expert in using some languages in coding"
          >I am expert in using some languages in coding</option
        >
        <option value="I am expert in using all languages in coding"
          >I am expert in using all languages in coding</option
        >
      </select>
    </div>
    <br />
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size: 15px">What is your major: </lable>
      <input
        style="border: 1px solid rgb(41,40,40); width: 500px"
        ;
        placeholder="Art,CS,..."
      />
    </div>
    <br />
    <div class="divClass" style="padding-left: 200px">
      <lable style="font-size: 15px">Age: </lable>
      <input
        style="border: 1px solid rgb(41,40,40); width: 500px"
        ;
        placeholder="14,15,.."
      />
    </div>

    <h2 style="text-align:center;"><a href=""> Submit </a></h2>
